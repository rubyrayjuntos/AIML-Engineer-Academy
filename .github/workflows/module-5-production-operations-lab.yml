name: Module 5 Production Operations Lab
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-module-5-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: Install lab dependencies
        working-directory: labs/module-5-production-operations
        run: pip install -r requirements.txt
      - name: Run release and rollback tests
        working-directory: labs/module-5-production-operations
        run: pytest -q --junitxml=test-results.xml
      - name: Generate machine-readable evidence
        working-directory: labs/module-5-production-operations
        run: python -m app.evidence --output artifacts/evidence.json
      - name: Validate evidence
        working-directory: labs/module-5-production-operations
        run: python -m json.tool artifacts/evidence.json
      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-5-evidence
          path: |
            labs/module-5-production-operations/test-results.xml
            labs/module-5-production-operations/artifacts/*.json
